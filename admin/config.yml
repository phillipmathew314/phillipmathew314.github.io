backend:
  name: turbo-github
  turbo_site_id: 8204b4a5-7150-462b-8990-9069761092d3
  branch: master
  deploy_status: false
  commit_messages:
    create: "Create brain candy draft: {{slug}}"
    update: "Update brain candy draft: {{slug}}"
    delete: "Delete brain candy draft: {{slug}}"
    uploadMedia: "Upload brain candy media: {{path}}"
    deleteMedia: "Delete brain candy media: {{path}}"

publish_mode: editorial_workflow
local_backend: true
search: false
show_preview_links: false

media_folder: "assets/images/brain-candy"
public_folder: "/assets/images/brain-candy"

collections:
  - name: brain-candy
    label: Brain Candy
    label_singular: Brain Candy post
    description: Problems and concepts that scratched an itch in my brain.
    folder: content/brain-candy/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{number}}-{{slug}}"
    slug_collision: reject
    summary: "brain candy #{{number}} · {{title}}"
    sortable_fields: [number, date, title]
    fields:
      - label: Number
        name: number
        widget: number
        value_type: int
        min: 1
        required: true
        hint: The installment number, such as 1 or 23.
      - label: Title
        name: title
        widget: string
        required: true
      - label: Description
        name: description
        widget: text
        required: true
        hint: One concise sentence that makes the reader curious.
      - label: Publish date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: MMM D, YYYY
        time_format: false
        required: true
      - label: Categories
        name: categories
        widget: list
        required: false
        default: []
        hint: Examples include Python, algorithms, brain teasers, or systems.
      - label: Body
        name: body
        widget: markdown
        required: true

