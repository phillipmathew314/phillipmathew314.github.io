name: Publish Brain Candy

on:
  push:
    branches: [master]
    paths:
      - "content/brain-candy/**"
      - "scripts/build-brain-candy.sh"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-brain-candy
  cancel-in-progress: false

jobs:
  render:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.11.9

      - name: Render Brain Candy
        run: ./scripts/build-brain-candy.sh

      - name: Commit rendered pages
        run: |
          if git diff --quiet -- blog/brain-candy; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blog/brain-candy
          git commit -m "Render Brain Candy posts"
          git pull --rebase origin master
          git push origin HEAD:master

